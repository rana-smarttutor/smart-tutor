<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Smart Tutors</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f0fdfa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: fadeUp 0.6s ease-out;
    }

    .logo-ring {
      width: 110px;
      height: 110px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 8px 40px rgba(79, 70, 229, 0.12), 0 0 0 1px rgba(79, 70, 229, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: breathe 2.4s ease-in-out infinite;
    }

    .logo-ring img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .dots {
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4f46e5;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    .text {
      font-size: 14px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.03em;
    }

    .brand {
      position: fixed;
      bottom: 40px;
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.55); opacity: 0.35; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { box-shadow: 0 8px 40px rgba(79, 70, 229, 0.12), 0 0 0 1px rgba(79, 70, 229, 0.06); }
      50% { box-shadow: 0 12px 48px rgba(79, 70, 229, 0.2), 0 0 0 1px rgba(79, 70, 229, 0.1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-ring">
      <img src="Smart-institue-logo.jpeg.png" alt="Smart Tutors" />
    </div>
    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <p class="text" id="loading-text">Loading</p>
  </div>

  <span class="brand">Smart Tutors</span>

  <script>
    let dots = 0;
    const el = document.getElementById('loading-text');
    setInterval(() => {
      dots = (dots + 1) % 4;
      el.textContent = 'Loading' + '.'.repeat(dots);
    }, 400);
  </script>
</body>
</html>
